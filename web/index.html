<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Logic Lab - شبیه‌ساز آفلاین مدارهای دیجیتال">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="logic_lab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Logic Lab</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1e293b,#0f172a);z-index:9999;overflow:hidden;">
    <div style="position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(59,130,246,.15) 50%,transparent 60%);animation:sweep 3s linear infinite;"></div>
    <div style="width:80px;height:80px;border:4px solid rgba(255,255,255,.1);border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;box-shadow:0 0 40px rgba(59,130,246,.4);"></div>
    <div style="margin-top:24px;color:#e2e8f0;font-family:sans-serif;font-size:18px;letter-spacing:2px;animation:pulse 1.5s ease-in-out infinite;">LOGIC LAB</div>
    <div style="margin-top:8px;color:#94a3b8;font-family:sans-serif;font-size:12px;">در حال بارگذاری...</div>
  </div>
  <style>
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
    @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  </style>
  <script>
    window.addEventListener('flutter-first-frame',function(){var l=document.getElementById('loading');if(l)l.remove();});
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
