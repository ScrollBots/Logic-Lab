name: Web preview

# Publishes the Flutter web build to GitHub Pages, so the interface can be
# reviewed on a phone browser without building the app locally.
# Note: the web target is a preview build and keeps its data in memory only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # The automatic deployment only runs when the repository variable
    # ENABLE_WEB_PREVIEW is set to "true" and GitHub Pages is enabled
    # (Settings -> Pages -> Source: GitHub Actions). A manual run always
    # executes, so the preview can be tested without touching the settings.
    if: >-
      vars.ENABLE_WEB_PREVIEW == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the web bundle
        run: flutter build web --release --no-pub --base-hash "${{ github.sha }}"

      - name: Configure GitHub Pages
        # Pages has to be enabled once (Settings -> Pages -> Source:
        # GitHub Actions). Until then the preview deployment is skipped
        # instead of failing the whole run.
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
