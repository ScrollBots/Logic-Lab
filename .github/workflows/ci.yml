name: CI

# Quality gate for every push and pull request:
#   1. formatting check  (dart format --set-exit-if-changed)
#   2. static analysis   (flutter analyze)
#   3. unit + widget tests (flutter test)
#   4. a real Android build (APK + App Bundle) as a smoke test
#
# The build artifacts of the smoke test can be downloaded from the run summary,
# so there is no need to build on a local machine.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep this in sync with the version used locally (Flutter 3.29.3 / Dart 3.7.2).
  FLUTTER_VERSION: "3.29.3"
  JAVA_VERSION: "17"

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate the CI configuration
        run: dart run tool/validate_ci.dart

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Unit and widget tests
        run: flutter test --no-pub --coverage --reporter expanded

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Android build smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the debug APK
        run: flutter build apk --debug --no-pub

      - name: Build the release App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Verify the application label and version
        shell: bash
        run: |
          set -euo pipefail
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -n 1)
          echo "--- badging ---"
          "$AAPT2" dump badging build/app/outputs/flutter-apk/app-debug.apk \
            | grep -E "^(package|application-label|sdkVersion|targetSdkVersion)" \
            | head -n 5
          if ! "$AAPT2" dump badging build/app/outputs/flutter-apk/app-debug.apk \
               | grep -q "application-label:'Logic Lab'"; then
            echo "The launcher label is not 'Logic Lab'" >&2
            exit 1
          fi

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app-build-${{ github.run_id }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
