version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"

  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    # Bundle the safe updates into a single pull request instead of one PR per
    # package.
    groups:
      pub-minor-and-patch:
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    ignore:
      # The toolchain is pinned to Flutter 3.29.3 (see FLUTTER_VERSION in the
      # workflows). The versions below require a newer Flutter/Dart SDK, or a
      # Kotlin 2.x Gradle plugin that Flutter 3.29 does not ship. Remove the
      # corresponding rule when the pinned Flutter version is raised.
      - dependency-name: "share_plus"
        versions: [">=11.0.0"]
      - dependency-name: "cupertino_icons"
        versions: [">=2.0.0"]
      - dependency-name: "flutter_lints"
        versions: [">=6.0.0"]
      - dependency-name: "path_provider"
        versions: [">=2.1.5"]
      - dependency-name: "shared_preferences"
        versions: [">=2.5.5"]
      - dependency-name: "url_launcher"
        versions: [">=6.3.2"]
      - dependency-name: "file_picker"
        versions: [">=11.0.4"]
