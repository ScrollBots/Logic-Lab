name: logic_lab
description: "Logic Lab - a Persian-first, fully offline digital logic circuit simulator."
publish_to: 'none'
version: 1.1.0+2
environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  yaml: ^3.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 400
