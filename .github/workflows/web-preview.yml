name: Web preview
run-name: >-
  ${{ format('Logic Lab | Optional web preview | {0} | Run #{1}', github.ref_name, github.run_number) }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.29.3"

jobs:
  deploy:
    name: Optional preview | Build and deploy to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v7

      - name: Configure the GitHub Pages target
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build the optional web preview
        id: build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: flutter build web --release --no-pub --base-href "$PAGES_BASE_PATH/"

      - name: Save the GitHub Pages artifact
        id: artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

      - name: Deploy the optional preview
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report optional-preview results
        if: always()
        env:
          PAGES: ${{ steps.pages.outcome || 'skipped' }}
          BUILD: ${{ steps.build.outcome || 'skipped' }}
          ARTIFACT: ${{ steps.artifact.outcome || 'skipped' }}
          DEPLOYMENT: ${{ steps.deployment.outcome || 'skipped' }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            printf '## Logic Lab — پیش‌نمایش اختیاری وب\n\n'
            printf '| مرحله | نتیجه |\n|---|---|\n'
            printf '| پیکربندی Pages | %s |\n' "$PAGES"
            printf '| بیلد وب | %s |\n' "$BUILD"
            printf '| ذخیرهٔ خروجی | %s |\n' "$ARTIFACT"
            printf '| استقرار | %s |\n' "$DEPLOYMENT"
            printf '\nاین گردش‌کار مستقل از انتشار اندروید است؛ داده‌های پیش‌نمایش در حافظه نگهداری می‌شوند.\n'
            if [ "$DEPLOYMENT" = success ]; then
              printf '\n[بازکردن پیش‌نمایش](%s)\n' "$PAGE_URL"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
